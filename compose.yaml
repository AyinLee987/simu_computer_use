services:
  desktop:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    env_file:
      - dockercompose.env
    environment:
      DISPLAY: ':99'
    ports:
      - '127.0.0.1:6080:6080'
      - '127.0.0.1:8000:8000'
    shm_size: '1gb'
    volumes:
      - desktop-workspace:/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'python3', '-c', 'import json,urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=2))["ready"]']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  desktop-workspace:
